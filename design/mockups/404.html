<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden — Reiseplaner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header" data-od-id="app-header">
  <div class="app-header__inner">
    <a class="brand" href="index.html" data-od-id="brand">
      <span class="brand__mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 21s-7-5.4-7-11a7 7 0 1 1 14 0c0 5.6-7 11-7 11z" fill="#FFFFFF"/>
          <circle cx="12" cy="10" r="2.5" fill="#0F766E"/>
        </svg>
      </span>
      Reiseplaner
    </a>
  </div>
</header>

<main class="container" data-od-id="main">
  <div class="empty-state" style="margin-top: var(--space-5);" data-od-id="not-found">
    <span class="empty-state__icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-5.4-7-11a7 7 0 1 1 14 0c0 5.6-7 11-7 11z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 9h.01M15 9h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M9 14c.6.6 1.6 1 3 1s2.4-.4 3-1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </span>
    <h2 style="font-size: 28px;">Seite nicht gefunden</h2>
    <p>Die angeforderte Seite oder Reise existiert nicht. Sie wurde möglicherweise gelöscht oder die Adresse ist nicht korrekt.</p>
    <a class="btn btn--primary" href="index.html" data-od-id="btn-back-home">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Zur Reiseliste
    </a>
  </div>
</main>
</body>
</html>
